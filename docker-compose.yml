services:
  postgres:
    image: postgres:16-alpine
    container_name: pln_multimedia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pln_multimedia}
      POSTGRES_USER: ${POSTGRES_USER:-pln_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pln_iconplus_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pln_admin} -d ${POSTGRES_DB:-pln_multimedia}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: pln_multimedia_pgdata
    driver: local
